name: PDF Build and Deploy

on:
  workflow_run:
    workflows: ["Initial Build and Deploy"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  pdf:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate PDF
        uses: narthanaj/html-to-pdf-action@v1.0.0
        with:
          source: https://vbanderov.github.io/svelte-cv/index.html#${{ secrets.ENCRYPTION_PASSWORD }}
          output: site/${{ secrets.ENCRYPTION_PASSWORD }}.pdf
          print_background: 'true'

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'site/'

      - name: Deploy
        uses: actions/deploy-pages@v4

  delete-build-artifacts:
    needs: pdf
    runs-on: ubuntu-latest
    steps:
      - name: Delete site artifact
        uses: geekyeggo/delete-artifact@v5.1.0
        with:
          name: site
